services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      # Defaults to localhost only. For LAN/Tailscale access set SEARXNG_BIND=0.0.0.0
      # in .env rather than editing this line -- .env is gitignored, so the binding
      # survives `git pull` instead of conflicting with it. Read the SECURITY notes
      # in ADVANCED.md before exposing this, and set SEARXNG_SECRET.
      - "${SEARXNG_BIND:-127.0.0.1}:8888:8080"
    volumes:
      - ./searxng/config:/etc/searxng
      - ./searxng/data:/var/cache/searxng
      # Patched engine: upstream sends an empty `iscqry=` param that Yahoo now
      # answers with HTTP 500. Re-copy from the image after a SearXNG upgrade.
      - ./searxng-patches/yahoo.py:/usr/local/searxng/searx/engines/yahoo.py:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-}
      # The image ships a precompiled __pycache__ next to the engine sources.
      # Without this, some workers load the stale yahoo.pyc instead of the
      # patched yahoo.py above and the engine fails intermittently. Sending the
      # bytecode cache elsewhere makes every worker compile the mounted source.
      - PYTHONPYCACHEPREFIX=/tmp/pycache

  mcp-searxng:
    build:
      context: ./mcp-searxng-patches
      dockerfile: Dockerfile
    image: mcp-searxng-enhanced:latest
    # Without this, `docker compose up -d` happily reuses whatever image is
    # already tagged mcp-searxng-enhanced:latest and never rebuilds, so a
    # changed Dockerfile (e.g. a new pinned base) silently does nothing.
    # Note this still only refreshes the IMAGE -- use `up -d --force-recreate`
    # to move the running container onto it.
    pull_policy: build
    container_name: mcp-searxng
    restart: unless-stopped
    ports:
      # Reachable off-box by default so remote MCP clients can connect. Set
      # MCP_BIND=127.0.0.1 in .env to restrict it to this machine.
      - "${MCP_BIND:-0.0.0.0}:3001:3001"
    volumes:
      - ./mcp-searxng-patches/index.js:/app/dist/index.js:ro
      - ./mcp-searxng-patches/types.js:/app/dist/types.js:ro
      - ./mcp-searxng-patches/search.js:/app/dist/search.js:ro
      - ./mcp-searxng-patches/url-reader.js:/app/dist/url-reader.js:ro
      - ./mcp-searxng-patches/http-server.js:/app/dist/http-server.js:ro
    environment:
      - SEARXNG_URL=http://searxng:8080
      - MCP_HTTP_PORT=3001
    depends_on:
      - searxng
