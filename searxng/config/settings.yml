# SearXNG settings for this stack, written for searxng/searxng:2026.9.23-3cd69d30e.
#
# This file holds ONLY our changes. SearXNG loads the image's own default
# settings.yml (/usr/local/searxng/searx/settings.yml) first and merges this file
# on top of it: top-level sections are merged key by key, and an engine entry
# here is merged into the default engine with the same `name`. Anything not set
# here comes from the image, so an upgrade picks up upstream fixes and new
# engines. To see what a key does or what the default is, read the image's file:
#   docker exec searxng cat /usr/local/searxng/searx/settings.yml
# https://docs.searxng.org/admin/settings/settings.html#use-default-settings
use_default_settings: true

search:
  # No autocomplete. The web UI would otherwise send every keystroke to
  # DuckDuckGo from this exit IP. The MCP server never uses autocomplete.
  autocomplete: ""
  suspended_times:
    # Upstream uses 180/3600/180. We used 30/60/30 for a while, which retried
    # blocked engines on almost every query, so each search paid the full
    # request timeout waiting on engines that were certain to fail, and the
    # repeated hits kept the instance flagged. Longer holds make searches
    # faster and let an engine's reputation recover.
    # For error "Access denied" and "HTTP error [402, 403]"
    SearxEngineAccessDenied: 900
    # For error "CAPTCHA"
    SearxEngineCaptcha: 1800
    # For error "Too many request" and "HTTP error 429"
    SearxEngineTooManyRequests: 900
  # The MCP server reads results as JSON. Remove json and it gets HTTP 403.
  formats:
    - html
    - json

server:
  # Placeholder only. docker-compose.yml always passes SEARXNG_SECRET into the
  # container, and the env var overrides this value even when it is empty, so
  # set a real one in .env. Generate one with:  openssl rand -hex 32
  secret_key: "CHANGE_ME_BEFORE_RUNNING"  # Is overwritten by ${SEARXNG_SECRET}
  # No rate limiter: the only client is the MCP server on the same host, and it
  # sends bursts of parallel queries (multi-query). Is overwritten by
  # ${SEARXNG_LIMITER}.
  limiter: false

outgoing:
  # default timeout in seconds, can be override by engine. The default is 3.0,
  # which is too short for several of the engines that still answer this IP.
  # Keep per-engine timeouts at or below this: a query waits for the LARGEST
  # timeout among the engines it selects, so one engine with timeout 10 makes
  # every query in its category wait up to 10 s.
  request_timeout: 5.0
  # HTTP/2 on, as upstream. We turned it off on the old httpx network stack,
  # where Yahoo dropped HTTP/2 connections and DuckDuckGo answered 202. Since
  # 2026.9.23 SearXNG sends requests through curl_cffi with Chrome TLS
  # impersonation, and yahoo and duckduckgo web answer normally over HTTP/2.
  # Off now does harm: it forces HTTP/1.1 for every engine (also the ones
  # upstream sends over HTTP/3: bing, bing images/news/videos, google cse,
  # google cse images, google scholar, yandex, youtube), which gives a TLS
  # fingerprint that no real Chrome sends, and the Wikimedia APIs
  # (wikicommons) answer it with HTTP 429.
  enable_http2: true

# This section REPLACES the image's plugin list (it is not merged key by key),
# so it must name every plugin. The values are the upstream defaults of
# 2026.9.23, except tracker_url_remover. After an upgrade, compare this list
# with the "plugins:" section of the image's settings.yml.
plugins:
  searx.plugins.calculator.SXNGPlugin:
    active: true
  searx.plugins.infinite_scroll.SXNGPlugin:
    active: false
  searx.plugins.hash_plugin.SXNGPlugin:
    active: true
  searx.plugins.self_info.SXNGPlugin:
    active: true
  searx.plugins.unit_converter.SXNGPlugin:
    active: true
  searx.plugins.ahmia_filter.SXNGPlugin:
    active: true
  searx.plugins.hostnames.SXNGPlugin:
    active: true
  searx.plugins.time_zone.SXNGPlugin:
    active: true
  searx.plugins.oa_doi_rewrite.SXNGPlugin:
    active: false
  searx.plugins.tor_check.SXNGPlugin:
    active: false
  # Off (upstream: on). It removes tracking arguments (utm_* etc.) from result
  # URLs, and it does this with a full scan of a SQLite table for each URL
  # (url, img_src, thumbnail_src). When several engines return results at the
  # same time, these scans compete for Python's GIL and one URL can take 0.1 to
  # 3 s instead of 0.03 ms. Image searches (about 200 results, 3 URLs each)
  # then took up to 4-5 s and engines timed out with their results only half
  # added. The code is the same in 2026.9.3 and 2026.9.23. Result URLs can now
  # keep tracking arguments; that does not matter for the MCP server.
  searx.plugins.tracker_url_remover.SXNGPlugin:
    active: false

engines:

  # --- general: web search ---------------------------------------------------
  # Also answering here with upstream defaults (no entry needed):
  #   google cse  - keyless, uses a hard-coded partner CX (blackle).
  #   wikipedia   - infobox only; it matches exact article titles.

  - name: bing
    # Stock engine. Do not patch it: a cookie-session patch gave fewer results
    # and was 4x slower. Bing sometimes answers a query with junk: pages that
    # match one query word only (e.g. the Boeing home page for "Boeing 737
    # bleed air leak detection"). It shows up after bursts of Bing queries from
    # this IP, and the MCP server's multi-query fan-out is such a burst. It is
    # not caused by HTTP/3 (upstream's choice for bing): in an A/B the same
    # queries gave the same junk over HTTP/3, HTTP/2 and HTTP/1.1, concurrent
    # or not.
    disabled: false

  - name: yahoo
    # The stock engine has had the YBV-cookie fix since 2026.9.23, so the local
    # yahoo.py patch is gone. Yahoo still rate-limits bursts: about the 5th
    # query within ~20 s gets HTTP 500 "INKApi Error". The stock engine still
    # sends an empty "iscqry=" argument on page 1 (the old patch removed it).
    # Yahoo accepts it now; if HTTP 500 comes back on every query, look there.
    disabled: false

  - name: duckduckgo web
    # Answers this IP, unlike the html endpoint below. It fails silently (no
    # results, no error) if duckduckgo.com stops serving deep_preload_link.
    # No time_range support.
    disabled: false

  - name: duckduckgo
    # The html endpoint answers this IP with a CAPTCHA, and the engine raises it
    # with suspended_time=0, which overrides our CAPTCHA suspension above: it
    # would be retried on every search.
    disabled: true

  - name: yandex
    # Answers this IP. Uses a hard-coded site-search searchid (3131712).
    disabled: false

  - name: keenable
    # Keyless. No paging and no time_range support.
    inactive: false
    disabled: false

  - name: swisscows
    # Keep weight 1: weight 2 pushed good results (docs.docker.com) from #1 to
    # #11. Its occasional HTTP 450 is a per-query "Unavailable For Legal
    # Reasons" filter, not an outage.
    inactive: false
    disabled: false

  - name: mwmbl
    # Healthy mwmbl answers in <1 s. Do not raise this above request_timeout:
    # a larger value raises the wait of every general query (see outgoing).
    # A smaller value does not help: every engine in a query gets the largest
    # timeout of the selected engines, so mwmbl still gets 5 s. When mwmbl is
    # slow, general queries take 5 s; only disabling it prevents that.
    timeout: 5.0
    disabled: false

  - name: mojeek
    # Loaded but off by default; use it with !mjk. It answers (the image solves
    # its ALTCHA proof-of-work, ~0.25 s CPU, token cached 7 days), but on the 6
    # benchmark queries it mostly added off-topic hits and pulled some into the
    # top 10: relevant results in the top 10 went from 57/60 without it to
    # 54/60 at weight 1 and 56/60 at weight 0.5. It is also the slowest general
    # engine (median 1.3 s). A revoked token gives 0 results and no error.
    inactive: false
    disabled: true

  - name: findborg
    # Keyless proxy of Brave's index (findborg.com), a third-party service.
    # Brave itself answers this IP with HTTP 429.
    inactive: false

  # Blocked from this exit IP. They fail on the first query from a cold
  # container, so this is IP reputation, not rate limiting.
  - name: brave
    disabled: true   # HTTP 429
  # The other brave engines share the "brave" network, so one 429 suspends all.
  - name: brave.images
    disabled: true
  - name: brave.news
    disabled: true
  - name: brave.videos
    disabled: true
  - name: startpage
    # Upstream now ships it inactive. Its Anubis solver handles difficulty <= 4,
    # and the site raises the difficulty for this IP after one query.
    inactive: true
    disabled: true
  - name: qwant
    disabled: true   # CAPTCHA, raised with suspended_time=0 (retried every search)
  - name: google
    disabled: true   # CAPTCHA ("sorry" page)
  - name: yep
    disabled: true   # HTTP 403 access denied
  - name: gmx
    disabled: true   # CAPTCHA on the first query

  # Broken, or no use from here.
  - name: seznam
    # Broken on the curl_cffi network stack: the engine pre-fetches the 1.4 MB
    # www.seznam.cz portal page with a hard-coded 3 s timeout, which curl_cffi
    # applies to the whole transfer (3 of 3 queries timed out). Its index is
    # Czech: its 2026.9.3 results re-ranked with the engines above added no
    # relevant result to the top 10 or top 20, at weight 1 or 0.5.
    disabled: true
  - name: wiby
    disabled: true   # retro-web index, only off-topic hits
  - name: crowdview
    disabled: true   # backend returns nothing for multi-word queries
  - name: wolframalpha
    # wolframalpha_noapi: the token request times out at a hard-coded 2 s from
    # this network (nginx 502 after ~10-15 s). No timeout setting fixes it.
    disabled: true

  - name: wikidata
    # Disabled since SearXNG 2026.4.29 threw KeyError in its init. That error is
    # gone in 2026.9.23, but the engine has not been tested from this IP, and
    # wikipedia already supplies the infoboxes.
    disabled: true

  # --- images ------------------------------------------------------------------
  # Upstream defaults also used: bing images, google cse images, pinterest.
  # The icon engines devicons and lucide stay at the upstream default (off, use
  # !di / !luc): lucide matches single words, e.g. it returned 18 "cog" icons
  # for "Boeing 787 landing gear", ranked #1 in images.

  - name: openverse
    disabled: false   # upstream now ships it disabled; relevant results here
  - name: flickr
    disabled: false   # upstream now ships it disabled; relevant results here
  - name: deviantart
    inactive: false   # upstream now ships it inactive; relevant results here
  # Since 2026.9.23 upstream puts pexels and unsplash only in the new "stock
  # images" category, which no MCP category selects. Put them back in images:
  # they answer this IP with relevant photos (up to 20 results each).
  - name: pexels
    categories: [images]
  - name: unsplash
    categories: [images]
  - name: duckduckgo images
    # HTTP 403 since 2026.9.23 (the engine now sends requests without browser
    # impersonation). It worked from this IP on 2026.9.3.
    disabled: true
  - name: qwant images
    disabled: true   # CAPTCHA, raised with suspended_time=0

  # --- videos ------------------------------------------------------------------

  - name: qwant videos
    # Answers this IP, although qwant web/images get a CAPTCHA. If it ever gets
    # one, it is retried on every search (the engine uses suspended_time=0).
    disabled: false
  - name: duckduckgo videos
    disabled: true   # same module and token flow as duckduckgo images (403)
  - name: google videos
    disabled: true   # not tested from this IP
  - name: sepiasearch
    # PeerTube index; its hits were off-topic (a Dingoo A320 game console for an
    # Airbus A320 query) and ranked below every other video engine. It also had
    # intermittent DNS failures (SERVFAIL for sepiasearch.org) from this host.
    disabled: true

  # --- news --------------------------------------------------------------------
  # google news is on (upstream default); it answers this IP again.

  - name: yahoo news
    inactive: false   # upstream now ships it inactive; answers this IP
  - name: qwant news
    disabled: false   # answers this IP; same suspended_time=0 caveat as above
  - name: duckduckgo news
    disabled: true   # same module and token flow as duckduckgo images (403)
  - name: wikinews
    # Sorts by creation date, so it returns old, off-topic articles (0 of 5
    # relevant for an Airbus news query).
    disabled: true

  # --- science -----------------------------------------------------------------

  - name: crossref
    # Upstream default is timeout 30, which would make every science query wait
    # up to 30 s. It answers in ~0.4 s.
    timeout: 5.0
    disabled: false
  - name: europepmc
    disabled: true   # new upstream default; biomedical index, mostly off-topic

  # --- it ----------------------------------------------------------------------

  - name: gentoo
    # Upstream default is timeout 10; see request_timeout above.
    timeout: 5.0
  - name: arch linux wiki
    disabled: true   # Anubis bot wall: 0 results with no error

  # --- music / files -----------------------------------------------------------

  - name: bandcamp
    disabled: true   # JS "Client Challenge" page: 0 results with no error
  - name: radio browser
    # It builds its server list from a reverse-DNS lookup of the addresses of
    # all.api.radio-browser.info. In Docker the reverse lookup fails, so the
    # list is empty and every music query logs "Fetched server list is empty!"
    # and returns nothing (the same on the older image). inactive = not loaded.
    inactive: true
  - name: kickass
    disabled: true   # TLS certificate error on every request
  - name: solidtorrents
    disabled: true   # empty document on every request

  # --- Tor ---------------------------------------------------------------------
  # Need a Tor proxy (see ADVANCED.md Tier 3). inactive = not loaded, so they do
  # not log "can't register engine" on every start. To use them, set
  # outgoing.using_tor_proxy and remove these entries.
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
