# HTTPS overlay. Activated automatically when MCP_HTTPS=true is set in .env
# (the mcp.cmd / mcp.sh wrappers translate that into the right COMPOSE_FILE).
#
# When this overlay is active:
#   - searxng and mcp-searxng no longer publish ports directly to the host
#   - Caddy publishes ports 8888 and 3001 instead, terminating TLS for both
#   - Self-signed cert is auto-generated by Caddy on first start (tls internal)
#   - Internal Docker networking still uses plain HTTP between Caddy <-> services

services:
  searxng:
    # Drop direct host port binding — Caddy will front this service
    ports: !reset []

  mcp-searxng:
    # Drop direct host port binding — Caddy will front this service
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: mcp-caddy
    restart: unless-stopped
    ports:
      # Same ports as the HTTP mode — only the protocol changes (http -> https)
      - "0.0.0.0:8888:8888"
      - "0.0.0.0:3001:3001"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - searxng
      - mcp-searxng

volumes:
  caddy-data:
  caddy-config:
